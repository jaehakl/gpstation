[project]
name = "gpstation-worker"
version = "0.1.0"
description = "GPStation terminal worker client"
authors = [{ name = "Jaehak Lee", email = "leejaehak87@gmail.com" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "typer>=0.12,<1.0",
    "websockets>=12.0,<14.0",
    "nvidia-ml-py>=12.535,<14.0",
]

[project.scripts]
gp-worker = "gpstation_worker.cli:app"

[tool.poetry]
packages = [{ include = "gpstation_worker" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
