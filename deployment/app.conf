#/etc/nginx/sites-available/app.conf

# =========================
# HTTP : 80
# =========================

server {
    listen 80;
    listen [::]:80;
    server_name onigiri.kr www.onigiri.kr;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / {
        return 301 https://www.onigiri.kr$request_uri;
    }
}

# =========================
# HTTPS : 443
# =========================

# apex(onigiri.kr) → www.onigiri.kr
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onigiri.kr;

    ssl_certificate     /etc/letsencrypt/live/www.onigiri.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.onigiri.kr/privkey.pem;

    return 301 https://www.onigiri.kr$request_uri;
}

# 메인 서비스 (www.onigiri.kr)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.onigiri.kr;

    ssl_certificate     /etc/letsencrypt/live/www.onigiri.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.onigiri.kr/privkey.pem;

    limit_req  zone=req_per_ip burst=200 nodelay;
    limit_conn conn_per_ip 40;

    client_max_body_size 16m;

    # API 프록시 → FastAPI(Uvicorn)
    location /api/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 60s;
    }

    # Next 정적 청크 캐싱
    location /_next/static/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 공개 화면 및 관리자 화면 → Next 서버
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header X-XSS-Protection "1; mode=block";
}
