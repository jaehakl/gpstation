[project]
name = "gpstation-v1-server"
version = "0.1.0"
description = "GP Station v1 DB-backed orchestration server"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "asyncpg>=0.30.0,<0.31.0",
    "fastapi>=0.115,<0.117",
    "python-dotenv>=1.1.1,<2.0.0",
    "pydantic-settings>=2.8,<3.0",
    "sqlalchemy>=2.0.41,<3.0.0",
    "uvicorn[standard]>=0.34,<0.36",
    "gpstation-v1-sdk",
]

[project.scripts]
gpstation-v1-server = "app.__main__:main"

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
gpstation-v1-sdk = { path = "../sdk", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
