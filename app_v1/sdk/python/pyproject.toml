[project]
name = "gpstation-v1-python-sdk"
version = "0.1.0"
description = "GP Station v1 Python SDK scaffold"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.10,<3.0",
]

[tool.poetry]
packages = [{ include = "gpstation_sdk_v1" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
