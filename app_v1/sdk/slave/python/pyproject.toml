[project]
name = "gpstation-v1-slave-python-sdk"
version = "0.1.0"
description = "GP Station v1 Python SDK for slave subprocess apps"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiortc>=1.9,<2.0",
    "gpstation-v1-protocol",
]

[tool.poetry]
packages = [{ include = "gpstation_slave_sdk_v1" }]

[tool.poetry.dependencies]
gpstation-v1-protocol = { path = "../../../protocol", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
