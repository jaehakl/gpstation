[project]
name = "gpstation-v1-sdk"
version = "0.1.0"
description = "Shared GP Station v1 Python SDK libraries"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
slave = [
    "aiortc>=1.9,<2.0",
]

[tool.poetry]
packages = [
    { include = "sdk", from = ".." },
]
exclude = [
    "master/**",
    "**/node_modules/**",
    "**/.next/**",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
