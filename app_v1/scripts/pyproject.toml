[project]
name = "gpstation-v1-scripts"
version = "0.1.0"
description = "Local smoke scripts for GP Station v1"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiortc>=1.9,<2.0",
    "websockets>=12.0,<16.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
