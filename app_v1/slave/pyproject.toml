[project]
name = "gpstation-v1-slave-launcher"
version = "0.1.0"
description = "GP Station v1 slave launcher app and subprocess runtime"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiortc>=1.9,<2.0",
    "pydantic-settings>=2.8,<3.0",
    "typer>=0.12,<1.0",
    "websockets>=12.0,<16.0",
    "gpstation-v1-protocol",
    "gpstation-v1-slave-python-sdk",
]

[project.scripts]
gpstation-v1-slave-launcher = "gpstation_slave_launcher_v1.cli:app"

[tool.poetry]
packages = [{ include = "gpstation_slave_launcher_v1" }, { include = "slave_plugins" }]
include = ["slave_plugins/**/manifest.json"]

[tool.poetry.dependencies]
gpstation-v1-protocol = { path = "../sdk/protocol/python", develop = true }
gpstation-v1-slave-python-sdk = { path = "../sdk/slave/python", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = [".", "../sdk/slave/python"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
