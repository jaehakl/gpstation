[llm]
default_model = "Qwen3.6-35B-A3B-Q8"
use_max_gpu = true
# Optional. When omitted, use_max_gpu selects -1 (GPU) or 0 (CPU).
# n_gpu_layers = -1
# Optional. When omitted, llama.cpp chooses its thread count.
# n_threads = 8
context_size = 262144
split_mode = "none"
tensor_split = []
main_gpu = 0
flash_attn = true
swa_full = false
n_batch = 1024
n_ubatch = 1024
offload_kqv = true
max_tokens = 8192
temperature = 0.8
top_p = 0.9
enable_thinking = false

[[llm.models]]
name = "Qwen3.6-35B-A3B-Q8"
path = "/ssd3/llm/Qwen3.6-35B-A3B-Q8_0.gguf"

[[llm.models]]
name = "Qwen3.6-27B-Q4"
path = "/ssd3/llm/Qwen3.6-27B-Q4_K_M.gguf"

[[llm.models]]
name = "Qwen3.6-27B-Q8"
path = "/ssd3/llm/Qwen3.6-27B-Q8_0.gguf"

[[llm.models]]
name = "Qwen3.6-35B-A3B-Uncensored-Q8"
path = "/ssd3/llm/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf"

[[llm.models]]
name = "gemma-4"
path = "/ssd3/llm/gemma-4-31B-it-QAT-Q4_0.gguf"

[[llm.models]]
name = "supergemma4"
path = "/ssd3/llm/supergemma4-26b-uncensored-fast-v2-Q4_K_M.gguf"
context_size = 131072
n_batch = 1024
n_ubatch = 512


[sdxl]
default_model = "main-sdxl"
controlnet_scribble_model_id = "xinsir/controlnet-scribble-sdxl-1.0"
controlnet_openpose_model_id = "xinsir/controlnet-openpose-sdxl-1.0"
step = 30
cfg = 7.0
height = 1024
width = 1024
strength = 1.0
max_chunk_size = 1
seed_min = 0
seed_max = 2147483647
sampler = "euler"
scheduler = ""
# Optional; omit to use the checkpoint default.
# clip_skip = 2
format = "png"
scribble_scale = 0.6
scribble_guidance_start = 0.0
scribble_guidance_end = 0.6
pose_scale = 0.9
pose_guidance_start = 0.0
pose_guidance_end = 0.8

[[sdxl.models]]
name = "main-sdxl"
path = "models/main-sdxl.safetensors"

[[sdxl.models]]
name = "fast-sdxl"
path = "models/fast-sdxl.safetensors"
step = 12
cfg = 4.5

[embeddings]
default_model = "local-embedding"

[[embeddings.models]]
name = "local-embedding"
path = "models/embedding"
local_files_only = true

[[embeddings.models]]
name = "cached-huggingface-embedding"
model_name = "organization/model-name"
revision = "0123456789abcdef0123456789abcdef01234567"
local_files_only = true
