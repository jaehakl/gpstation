[tool.poetry]
name = "onigiri-neo-ai"
version = "0.0.1"
description = "Onigiri Neo AI API"
authors = ["Jaehak Lee <leejaehak87@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
uvicorn = "^0.34.3"
fastapi = "^0.115.14"
python-dotenv = "^1.1.1"
pydantic-settings = "^2.10.1"
pydantic = "^2.12.5"
torch = { version = "2.7.0+cu128", source = "pytorch-gpu" }
diffusers = "^0.35.1"
transformers = ">=4.41.2,<5.0.0"
sentence-transformers = "^5.1.0"
protobuf = ">=3.20.3,<6.0.0"
sentencepiece = ">=0.1.91,<0.3.0"
llama-cpp-python = { version = "^0.3.28", source = "llama-cpp-python-cu130" }
nvidia-cublas = "13.1.1.3"
nvidia-cuda-runtime = "13.1.80"
accelerate = "^1.14.0"
pillow = "^12.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[[tool.poetry.source]]
name = "llama-cpp-python-cu130"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu130"
priority = "explicit"
