[project]
name = "gpstation-v1-slave-executable-cae"
version = "0.1.0"
description = "GP Station v1 Caemble CAE slave executable"
authors = [{ name = "GP Station" }]
requires-python = ">=3.11,<3.15"
dependencies = [
    "gpstation-v1-sdk[slave]",
    "numpy>=2.1,<3.0",
]

[tool.poetry]
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
gpstation-v1-sdk = { path = "../../sdk", develop = true, extras = ["slave"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-asyncio = ">=1.0,<2.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
